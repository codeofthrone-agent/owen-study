<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
    </marker>
    <style>
      .title { font: 700 42px Arial, "Noto Sans TC", sans-serif; }
      .h { font: 700 24px Arial, "Noto Sans TC", sans-serif; }
      .t { font: 18px Arial, "Noto Sans TC", sans-serif; }
      .s { font: 16px Arial, "Noto Sans TC", sans-serif; }
      .box { stroke: #222; stroke-width: 2; rx: 14; ry: 14; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#ffffff"/>
  <text x="30" y="60" class="title">Chapter 1 現場驗收示意圖（依圖一邏輯）</text>

  <rect x="40" y="100" width="1520" height="820" fill="none" stroke="#333" stroke-width="3" rx="18"/>

  <rect class="box" x="80" y="150" width="380" height="320" fill="#e3f2fd"/>
  <text x="96" y="186" class="h">Zone A｜入口 / 主通道</text>

  <rect class="box" x="500" y="150" width="420" height="320" fill="#e8f5e9"/>
  <text x="516" y="186" class="h">Zone B｜中段 / 設備區</text>

  <rect class="box" x="960" y="150" width="560" height="320" fill="#fff3e0"/>
  <text x="976" y="186" class="h">Zone C｜手臂作業區</text>

  <rect class="box" x="80" y="510" width="1440" height="360" fill="#f3e5f5"/>
  <text x="96" y="546" class="h">Zone D｜感測區（Awning + Light4）</text>

  <rect class="box" x="300" y="235" width="96" height="50" fill="#ffe082"/><text x="312" y="300" class="s">CAM-01</text>
  <rect class="box" x="340" y="330" width="96" height="50" fill="#ffe082"/><text x="352" y="395" class="s">CAM-02</text>
  <rect class="box" x="1120" y="245" width="96" height="50" fill="#ffe082"/><text x="1132" y="310" class="s">CAM-03</text>
  <rect class="box" x="1320" y="320" width="96" height="50" fill="#ffe082"/><text x="1332" y="385" class="s">CAM-04</text>

  <rect class="box" x="620" y="250" width="96" height="50" fill="#ffccbc"/><text x="632" y="315" class="s">SPK-01</text>
  <rect class="box" x="740" y="335" width="96" height="50" fill="#ffccbc"/><text x="752" y="400" class="s">SPK-02</text>
  <rect class="box" x="1080" y="360" width="96" height="50" fill="#ffccbc"/><text x="1092" y="425" class="s">SPK-03</text>

  <rect class="box" x="560" y="620" width="360" height="140" fill="#d7ccc8"/>
  <text x="590" y="690" class="h">Scarlett 4i4（音訊介面位置）</text>

  <rect class="box" x="980" y="620" width="420" height="140" fill="#ce93d8"/>
  <text x="1010" y="682" class="h">FP2 Sensor（Awning + Light4）</text>
  <text x="1010" y="718" class="t">磁吸安裝，可快速拆裝</text>

  <line x1="330" y1="260" x2="340" y2="355" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="330" y1="260" x2="1120" y2="270" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="330" y1="260" x2="1320" y2="345" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="740" y1="620" x2="670" y2="300" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="620" x2="790" y2="385" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="620" x2="1128" y2="410" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="1190" y1="760" x2="1190" y2="840" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="60" y="945" class="t">流程：1) 先 Wi‑Fi 位置/配線/配電 → 2) IPCAM 依圖一觀測位置與配電 → 3) Speaker 配線接 Scarlett 4i4 → 4) FP2 定位 Awning + Light4</text>
</svg>
