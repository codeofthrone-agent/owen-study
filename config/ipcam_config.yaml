  # 實驗室環境
  taipei_lab:
    description: "實驗室測試環境"
    cameras:
      level1:
        ip: "192.168.165.184"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"  # 主串流：/live0，次串流：/live1
        transport: "udp"       # ✨ 強制使用 UDP 傳輸 (避免 461 錯誤)
        description: "Level 1 監控攝影機"
        # username 和 password 會自動從 .env 讀取 IPCAM_USERNAME 和 IPCAM_PASSWORD

      level2:
        ip: "192.168.165.127"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "Level 2 監控攝影機"
        # username 和 password 會自動從 .env 讀取

      motor:
        ip: "10.42.0.39"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "馬達區域監控攝影機"
        # username 和 password 會自動從 .env 讀取

      panel:
        ip: "10.42.0.246"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "馬達區域監控攝影機"
        # username 和 password 會自動從 .env 讀取

  # RV 車環境
