      rv_motor:
        ip: "192.168.166.176"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "RV 馬達攝影機"
        # username 和 password 會自動從 .env 讀取        

# 燈光檢測設定
light_detection:
  # 亮度閾值設定
  brightness_threshold:
    dark: 50        # 暗（燈關閉）閾值，低於此值視為燈關閉
    bright: 150     # 亮（燈開啟）閾值，高於此值視為燈開啟

  # 影像處理參數
  image_processing:
    capture_delay: 1.0        # 擷取影像前的延遲時間（秒）
    analysis_region: "center" # 分析區域：center（中心）、full（全圖）
    sample_size: 100          # 採樣像素數量

  # 連線設定
  connection:
    timeout: 10               # 連線逾時時間（秒）
    retry_attempts: 3         # 重試次數
    retry_delay: 2            # 重試間隔（秒）
    rtsp_buffer_size: 1       # RTSP 緩衝幀數，1 表示最新幀
    frame_skip: 3             # 跳過前 N 幀以獲取穩定影像

# 注意:
# 多燈號陣列配置已遷移到各環境的按鈕配置檔案中
# 請參考: config/robot_arm/taipei_lab_buttons.yaml 的 environment_lights 區塊

