# IP Camera 環境配置文件
# 用於管理不同環境（實驗室、RV 車）的 IP Camera 設定
#
# 認證資訊配置方式:
# 1. 所有攝影機使用相同帳密 -> 在 .env 文件中設定 IPCAM_USERNAME 和 IPCAM_PASSWORD
# 2. 個別攝影機需要不同帳密 -> 在下方 cameras 中直接設定 username 和 password
#
# 配置優先順序: YAML 設定 > .env 環境變數 > 空字串

environments:
  # 實驗室環境
  laboratory:
    description: "實驗室測試環境"
    cameras:
      level1:
        ip: "192.168.165.184"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"  # 主串流：/live0，次串流：/live1
        description: "Level 1 監控攝影機"
        # username 和 password 會自動從 .env 讀取 IPCAM_USERNAME 和 IPCAM_PASSWORD

      level2:
        ip: "192.168.165.127"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        description: "Level 2 監控攝影機"
        # username 和 password 會自動從 .env 讀取

      motor:
        ip: "10.42.0.39"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        description: "馬達區域監控攝影機"
        # username 和 password 會自動從 .env 讀取

      panel:
        ip: "10.42.0.246"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        description: "馬達區域監控攝影機"
        # username 和 password 會自動從 .env 讀取

  # RV 車環境
  rv_vehicle:
    description: "RV 車測試環境"
    cameras: {}  # 待補充 RV 車的攝影機資訊

# 燈光檢測設定
light_detection:
  # 亮度閾值設定
  brightness_threshold:
    dark: 50        # 暗（燈關閉）閾值，低於此值視為燈關閉
    bright: 150     # 亮（燈開啟）閾值，高於此值視為燈開啟

  # 影像處理參數
  image_processing:
    capture_delay: 1.0        # 擷取影像前的延遲時間（秒）
    analysis_region: "center" # 分析區域：center（中心）、full（全圖）
    sample_size: 100          # 採樣像素數量

  # 連線設定
  connection:
    timeout: 10               # 連線逾時時間（秒）
    retry_attempts: 3         # 重試次數
    retry_delay: 2            # 重試間隔（秒）
    rtsp_buffer_size: 1       # RTSP 緩衝幀數，1 表示最新幀
    frame_skip: 3             # 跳過前 N 幀以獲取穩定影像

# 多燈號陣列偵測配置
multi_light_arrays:
  # 預設陣列配置
  default_array:
    name: "實驗室燈泡陣列"
    environment: "laboratory"
    camera: "level1"

    # 陣列布局
    layout:
      rows: 3               # 行數
      cols: 4               # 列數
      total_lights: 12      # 總燈泡數

    # ROI 自動偵測設定
    roi_detection:
      method: "manual"      # 偵測方式：auto（自動）、manual（手動）
      edge_threshold: 100   # 邊緣偵測閾值（僅用於 auto 模式）
      margin_ratio: 0.05    # ROI 邊界內縮比例（避免紙箱邊緣干擾）

    # 手動定義 ROI 區域（相對座標，範圍 0.0 - 1.0）
    # 格式：[row, col, x_min, y_min, x_max, y_max]
    # 範例：第 0 行第 0 列，左上角 (0.0, 0.0)，右下角 (0.25, 0.33)
    manual_roi:
      # 第 0 行
      - [0, 0, 0.00, 0.00, 0.25, 0.33]
      - [0, 1, 0.25, 0.00, 0.50, 0.33]
      - [0, 2, 0.50, 0.00, 0.75, 0.33]
      - [0, 3, 0.75, 0.00, 1.00, 0.33]
      # 第 1 行
      - [1, 0, 0.00, 0.33, 0.25, 0.67]
      - [1, 1, 0.25, 0.33, 0.50, 0.67]
      - [1, 2, 0.50, 0.33, 0.75, 0.67]
      - [1, 3, 0.75, 0.33, 1.00, 0.67]
      # 第 2 行
      - [2, 0, 0.00, 0.67, 0.25, 1.00]
      - [2, 1, 0.25, 0.67, 0.50, 1.00]
      - [2, 2, 0.50, 0.67, 0.75, 1.00]
      - [2, 3, 0.75, 0.67, 1.00, 1.00]

    # 個別燈泡配置（可選，覆蓋全域設定）
    light_configs:
      "0_0":  # 第 0 行第 0 列
        name: "燈泡 A1"
        bright_threshold: 150
        dark_threshold: 50
      "0_1":
        name: "燈泡 A2"
      "0_2":
        name: "燈泡 A3"
      "0_3":
        name: "燈泡 A4"
      "1_0":
        name: "燈泡 B1"
      "1_1":
        name: "燈泡 B2"
      "1_2":
        name: "燈泡 B3"
      "1_3":
        name: "燈泡 B4"
      "2_0":
        name: "燈泡 C1"
      "2_1":
        name: "燈泡 C2"
      "2_2":
        name: "燈泡 C3"
      "2_3":
        name: "燈泡 C4"

    # 亮度分級設定（強弱判定）
    brightness_levels:
      off: [0, 50]         # 關閉：0-50
      dim: [51, 100]       # 微弱：51-100
      medium: [101, 180]   # 中等：101-180
      bright: [181, 255]   # 明亮：181-255
