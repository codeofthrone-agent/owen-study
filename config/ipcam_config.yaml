# IP Camera 環境配置文件
# 用於管理不同環境（實驗室、RV 車）的 IP Camera 設定
#
# 認證資訊配置方式:
# 1. 所有攝影機使用相同帳密 -> 在 .env 文件中設定 IPCAM_USERNAME 和 IPCAM_PASSWORD
# 2. 個別攝影機需要不同帳密 -> 在下方 cameras 中直接設定 username 和 password
#
# 配置優先順序: YAML 設定 > .env 環境變數 > 空字串

environments:
  # 實驗室環境
  taipei_lab:
    description: "實驗室測試環境"
    cameras:
      level1:
        ip: "192.168.165.184"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"  # 主串流：/live0，次串流：/live1
        transport: "tcp"       # ✨ SwitchBot 建議使用 TCP 傳輸 (穩定性較佳)
        description: "Level 1 監控攝影機"
        # username 和 password 會自動從 .env 讀取 IPCAM_USERNAME 和 IPCAM_PASSWORD

      level2:
        ip: "192.168.165.127"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "tcp"
        description: "Level 2 監控攝影機"
        # username 和 password 會自動從 .env 讀取

      motor:
        ip: "192.168.165.136"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "tcp"
        description: "馬達區域監控攝影機"
        # username 和 password 會自動從 .env 讀取

      # ===== 暫時停用 (10.42.0.x 子網不可達) =====
      # panel:
      #   ip: "10.42.0.246"
      #   port: 554
      #   protocol: "rtsp"
      #   stream_path: "/live0"
      #   transport: "udp"
      #   description: "馬達區域監控攝影機"
      #   # username 和 password 會自動從 .env 讀取
      # ===== 暫時停用結束 =====

  # RV 車環境
  rv_car:
    description: "RV 車測試環境"
    cameras:
      cam1:
        ip: "192.168.166.187"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"  # 主串流：/live0，次串流：/live1
        transport: "udp"       # ✨ 強制使用 UDP 傳輸
        description: "燈光區域一監控攝影機"
        # username 和 password 會自動從 .env 讀取 IPCAM_USERNAME 和 IPCAM_PASSWORD

      cam2:
        ip: "192.168.166.177"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "燈光區域二監控攝影機"
        # username 和 password 會自動從 .env 讀取

      cam3:
        ip: "192.168.166.172"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "燈光區域三監控攝影機"
        # username 和 password 會自動從 .env 讀取
        aruco:
          name: "蘆竹區RV車ArUco的參數"
          target_id: 1
          history_size: 10
          move_threshold: 150
          stable_threshold: 110
          confidence_required: 7

      rv_panel:
        ip: "192.168.166.158"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "RV 車面板監控攝影機"
        # username 和 password 會自動從 .env 讀取

      taoyuan_4F:
        ip: "10.42.0.25"
        port: 554
        protocol: "rtsp"
        stream_path: "/live0"
        transport: "udp"
        description: "RV 馬達攝影機"
        # username 和 password 會自動從 .env 讀取        
        aruco:
          name: "rv_motor 專屬的高門檻防抖參數"
          target_id: 1
          history_size: 15
          move_threshold: 3500
          stable_threshold: 1500
          confidence_required: 10

    # FP2 雷達感測器設定區塊
    # 此區塊供 fp2_detect 模組讀取，可用於自動化檢測雨遮與房間擴展狀態
    fp2_sensors:
      awning_fp2:
        alias: "my_fp2_sensor"           # 設備在 HomeKit Local 協議註冊的別名 (名稱必須與 Pairing 時一致)
        description: "RV 雨遮佔用與空間感測雷達"  # 人類可讀的用途說明
        # setup_code: "129-99-964"       # 已移至 .env (AWNING_FP2_SETUP_CODE 或 FP2_SETUP_CODE) 以避免明文紀錄
        awning_threshold: 2              # 【雨遮模式】觸發「佔用/展開」所需要的最少網格數量 (例如 2 代表要有兩個以上的網格被遮蔽才算展開)
        slide_threshold: 1               # 【側推模式】觸發「佔用/收起」所需要的最少網格數量 (與雨遮邏輯相反，被牆壁推回視為佔用)

# 燈光檢測設定
light_detection:
  # 亮度閾值設定
  brightness_threshold:
    dark: 50        # 暗（燈關閉）閾值，低於此值視為燈關閉
    bright: 150     # 亮（燈開啟）閾值，高於此值視為燈開啟

  # 影像處理參數
  image_processing:
    capture_delay: 1.0        # 擷取影像前的延遲時間（秒）
    analysis_region: "center" # 分析區域：center（中心）、full（全圖）
    sample_size: 100          # 採樣像素數量

  # 連線設定
  connection:
    timeout: 10               # 連線逾時時間（秒）
    retry_attempts: 3         # 重試次數
    retry_delay: 2            # 重試間隔（秒）
    rtsp_buffer_size: 1       # RTSP 緩衝幀數，1 表示最新幀
    frame_skip: 3             # 跳過前 N 幀以獲取穩定影像

# 注意:
# 多燈號陣列配置已遷移到各環境的按鈕配置檔案中
# 請參考: config/robot_arm/taipei_lab_buttons.yaml 的 environment_lights 區塊

