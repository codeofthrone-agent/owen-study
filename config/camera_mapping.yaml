# 注意事項:
# 1. SwitchBot API 不提供影像串流，僅用於設備管理與事件通知
# 2. 影像分析必須透過 RTSP 協定直接存取 Camera
# 3. 認證資訊請在 .env 中設定 IPCAM_USERNAME 和 IPCAM_PASSWORD
# 4. 未分類 Camera 需要先確認 IP 地址後才能進行影像分析
