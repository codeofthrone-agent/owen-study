# SwitchBot Camera 與 RTSP 影像源映射配置
# 用於將 SwitchBot API 設備 ID 映射到 RTSP 串流
#
# 用途:
# - 統一管理 SwitchBot Camera 設備資訊與 RTSP 連線資訊
# - 提供設備 ID 到 IP 地址的自動轉換
# - 支援設備狀態查詢與影像分析整合
#
# 最後更新: 2026-02-02

# 台北實驗室 Camera 映射
taipei_lab:
  level1:
    # SwitchBot API 資訊
    switchbot_device_id: "B0E9FE00E194"
    switchbot_device_name: "Level1"
    switchbot_device_type: "Pan/Tilt Cam Plus 3K"
    
    # RTSP 連線資訊
    rtsp_ip: "192.168.165.184"
    rtsp_port: 554
    rtsp_stream_path: "/live0"
    rtsp_transport: "tcp"
    
    # 環境配置對應
    ipcam_config_key: "taipei_lab.level1"
    description: "Level 1 監控攝影機"

  level2:
    switchbot_device_id: "B0E9FE019CE9"
    switchbot_device_name: "Level2"
    switchbot_device_type: "Pan/Tilt Cam Plus 3K"
    
    rtsp_ip: "192.168.165.127"
    rtsp_port: 554
    rtsp_stream_path: "/live0"
    rtsp_transport: "tcp"
    
    ipcam_config_key: "taipei_lab.level2"
    description: "Level 2 監控攝影機"

  motor:
    switchbot_device_id: "B0E9FE01FCFC"
    switchbot_device_name: "Motor"
    switchbot_device_type: "Pan/Tilt Cam Plus 3K"
    
    rtsp_ip: "192.168.165.136"
    rtsp_port: 554
    rtsp_stream_path: "/live0"
    rtsp_transport: "tcp"
    
    ipcam_config_key: "taipei_lab.motor"
    description: "馬達區域監控攝影機"

