# MyCobot 280 按鈕位置配置
# 從 click_angles 文件轉換而來
# 每個按鈕包含上下位置角度、速度、次數等參數

# Robot Arm 連接配置
connection:
  # Socket 連接配置 (優先)
  socket:
    host: "10.42.0.180"  # MyCobot 280 的 IP 地址
    port: 9000           # 預設端口

  # 串口連接配置 (備用)
  serial:
    port: "/dev/ttyTHS1"  # JetsonNano 預設串口
    baudrate: 1000000

# 全局預設值
defaults:
  speed: 100
  press_duration: 1.0  # 按下保持時間 (秒)
  lift_duration: 0.1   # 抬起後等待時間 (秒)
  count: 1             # 按壓次數

# 按鈕位置定義
