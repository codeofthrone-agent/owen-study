metadata:
  version: 4.2.0
  created_date: '2025-11-18'
  last_updated: '2025-11-27'
  migrated_from: config/robot_arm/button_positions.yaml
  total_buttons: 23
  total_environment_lights: 13
  button_breakdown: {rv_control: 7, observe_position: 16}
  environment_light_breakdown: {vehicle_light: 4, area_light: 9}
  notes: [按鈕檢測使用機器手臂 Socket 影像源, 環境燈光檢測使用固定 IP Camera, '所有 RV 控制按鈕使用標準觀測角度 [1.75,
