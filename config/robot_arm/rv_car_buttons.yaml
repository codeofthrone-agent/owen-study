metadata:
  version: 4.2.0
  created_date: '2025-11-18'
  last_updated: '2025-11-27'
  migrated_from: config/robot_arm/button_positions.yaml
  total_buttons: 23
  total_environment_lights: 13
  button_breakdown: {rv_control: 7, observe_position: 16}
  environment_light_breakdown: {vehicle_light: 4, area_light: 9}
  notes: [按鈕檢測使用機器手臂 Socket 影像源, 環境燈光檢測使用固定 IP Camera, '所有 RV 控制按鈕使用標準觀測角度 [1.75,
      9.93, -134.73, 34.45, 2.19, -45.08]', 觀測點使用較慢速度 50 (vs 標準 100), '特殊按壓行為: water_pump/water_heater/gas/tanker_heater
      = 4 次按壓', '特殊按壓行為: extend/retract = 7 秒長按', 觀測點 press_duration=0.0 表示不執行按壓動作,
    車載燈光使用絕對座標 ROI，需根據實際 Camera 解析度調整]
voice_mappings:
  light_one: {environment_light: area1_light_1, panel_light: light_one}
  light_two: {environment_light: area2_light_2, panel_light: light_two}
  light_three: {environment_light: area1_light_3, panel_light: light_three}
  light_four: {environment_light: area3_light_4, panel_light: light_four}
