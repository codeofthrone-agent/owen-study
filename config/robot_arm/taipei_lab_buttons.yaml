  description: "台北實驗室控制面板，包含 8 個燈光按鈕和 5 個控制按鈕"

# 機器手臂連接配置
connection:
  socket:
    host: "10.42.0.180"
    port: 9000
  serial:
    port: "/dev/ttyTHS1"
    baudrate: 1000000

# 預設參數
