metadata:
  version: 4.2.0
  created_date: '2025-11-18'
  last_updated: '2025-11-19'
  migrated_from: [config/robot_arm/button_positions.yaml, config/ipcam_config.yaml
      (multi_light_arrays)]
  total_buttons: 13
  total_environment_lights: 31
  button_breakdown: {panel_light: 8, control: 5}
  environment_light_breakdown: {level1_light_array: 12, level2_light_array: 12, motor_areas: 7}
  notes: [按鈕檢測使用機器手臂 Socket 影像源, '環境燈光檢測使用固定 IP Camera (level1: 192.168.165.184, level2:
      192.168.165.127, motor: 10.42.0.39)', '所有按鈕使用標準觀測角度 [1.75, 9.93, -134.73, 34.45,
      2.19, -45.08]', light1 和 light2 包含 ArUco marker 參考數據，可用於精確定位校準, '部分按鈕有特殊按壓參數（count=2,
      press_duration=0.5, lift_duration=0.5）', 物理燈光陣列使用相對座標 (0.0-1.0)，方便不同解析度的 Camera,
    'v4.2.0: 支援多 Camera 多 ROI 配置，level1 和 level2 各 12 個燈泡，motor 有 7 個區域']

voice_mappings:
  light_one:
    environment_light: level1_light_1
    panel_light: light1
  light_two:
    environment_light: level1_light_2
    panel_light: light2
  light_three:
    environment_light: level1_light_3
    panel_light: light3
  light_four:
    environment_light: level1_light_4
    panel_light: light4
