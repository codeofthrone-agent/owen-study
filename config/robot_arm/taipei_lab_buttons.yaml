# ========================================
# 物理環境燈光配置 (Physical Environment Lights)
# 從 ipcam_config.yaml 整合
# 使用固定 IP Camera: level2 (192.168.165.127)
# ========================================

environment_lights:
  # 燈光陣列配置
  light_array:
    name: "實驗室燈泡陣列"
    type: "light_array"
    environment: "taipei_lab"
    camera_id: "level2"  # 使用 level2 Camera 進行檢測
    camera_ip: "192.168.165.127"
    camera_purpose: "light_array_detection"

    # 陣列布局
    layout:
      rows: 3
      cols: 4
      total_lights: 12

    # 亮度分級設定
    brightness_levels:
      off: [0, 50]         # 關閉：0-50
      dim: [51, 100]       # 微弱：51-100
      medium: [101, 180]   # 中等：101-180
      bright: [181, 255]   # 明亮：181-255

    # 個別燈泡配置 (3x4 網格)
    lights:
      # 第 0 行 (Row A)
      "0_0":
        name: "燈泡 A1"
        position: [0, 0]  # [row, col]
        roi: [0.00, 0.00, 0.25, 0.33]  # [x_min, y_min, x_max, y_max] (相對座標 0.0-1.0)
        bright_threshold: 150
        dark_threshold: 50

      "0_1":
        name: "燈泡 A2"
        position: [0, 1]
        roi: [0.25, 0.00, 0.50, 0.33]
        bright_threshold: 150
        dark_threshold: 50

      "0_2":
        name: "燈泡 A3"
        position: [0, 2]
        roi: [0.50, 0.00, 0.75, 0.33]
        bright_threshold: 150
        dark_threshold: 50

      "0_3":
        name: "燈泡 A4"
        position: [0, 3]
        roi: [0.75, 0.00, 1.00, 0.33]
        bright_threshold: 150
        dark_threshold: 50

      # 第 1 行 (Row B)
      "1_0":
        name: "燈泡 B1"
        position: [1, 0]
        roi: [0.00, 0.33, 0.25, 0.67]
        bright_threshold: 150
        dark_threshold: 50

      "1_1":
        name: "燈泡 B2"
        position: [1, 1]
        roi: [0.25, 0.33, 0.50, 0.67]
        bright_threshold: 150
        dark_threshold: 50

      "1_2":
        name: "燈泡 B3"
        position: [1, 2]
        roi: [0.50, 0.33, 0.75, 0.67]
        bright_threshold: 150
        dark_threshold: 50

      "1_3":
        name: "燈泡 B4"
        position: [1, 3]
        roi: [0.75, 0.33, 1.00, 0.67]
        bright_threshold: 150
        dark_threshold: 50

      # 第 2 行 (Row C)
      "2_0":
        name: "燈泡 C1"
        position: [2, 0]
        roi: [0.00, 0.67, 0.25, 1.00]
        bright_threshold: 150
        dark_threshold: 50

      "2_1":
        name: "燈泡 C2"
        position: [2, 1]
        roi: [0.25, 0.67, 0.50, 1.00]
        bright_threshold: 150
        dark_threshold: 50

      "2_2":
        name: "燈泡 C3"
        position: [2, 2]
        roi: [0.50, 0.67, 0.75, 1.00]
        bright_threshold: 150
        dark_threshold: 50

      "2_3":
        name: "燈泡 C4"
        position: [2, 3]
        roi: [0.75, 0.67, 1.00, 1.00]
        bright_threshold: 150
        dark_threshold: 50

# ========================================
# 環境專屬 HSV 調整（如果有）
# ========================================
hsv_adjustments:
  blue:
    lower: [95, 50, 50]
    upper: [135, 255, 255]

# ========================================
# 配置元數據
# ========================================
metadata:
  version: "4.1.0"
  created_date: "2025-11-18"
  last_updated: "2025-11-18"
  migrated_from:
    - "config/robot_arm/button_positions.yaml"
    - "config/ipcam_config.yaml (multi_light_arrays)"
  total_buttons: 13
  total_environment_lights: 12
  button_breakdown:
    panel_light: 8
    control: 5
  environment_light_breakdown:
    light_array: 12  # 3x4 網格
  notes:
    - "按鈕檢測使用機器手臂 Socket 影像源"
    - "環境燈光檢測使用固定 IP Camera (level2: 192.168.165.127)"
    - "所有按鈕使用標準觀測角度 [1.75, 9.93, -134.73, 34.45, 2.19, -45.08]"
    - "light1 和 light2 包含 ArUco marker 參考數據，可用於精確定位校準"
    - "部分按鈕有特殊按壓參數（count=2, press_duration=0.5, lift_duration=0.5）"
    - "物理燈光陣列使用相對座標 (0.0-1.0)，方便不同解析度的 Camera"
